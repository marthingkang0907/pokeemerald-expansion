name: San999 Dev ROM Build

on:
  push:
    branches:
      - san999-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build Emerald ROM
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
        run: make -j$(nproc) -O all

      - name: Verify ROM output
        run: test -f pokeemerald.gba

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: san999-pokeemerald
          path: pokeemerald.gba
          if-no-files-found: error
          retention-days: 14
