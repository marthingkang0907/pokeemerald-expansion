name: San999 Dev ROM Build

on:
  push:
    branches:
      - san999-dev
    paths-ignore:
      - 'web-build/game.gba'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build Emerald ROM
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
        run: make -j$(nproc) -O all

      - name: Publish ROM in repository
        run: |
          test -f pokeemerald.gba
          mkdir -p web-build
          cp pokeemerald.gba web-build/game.gba
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-build/game.gba
          if git diff --cached --quiet; then
            echo "ROM unchanged"
            exit 0
          fi
          git commit -m "Publish web ROM"
          git push origin HEAD:san999-dev

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: san999-pokeemerald
          path: pokeemerald.gba
          if-no-files-found: error
          retention-days: 14
